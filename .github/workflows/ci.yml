name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: ['format:check', 'contracts:check', lint, typecheck, test, build]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: pnpm ${{ matrix.check }}

  runner:
    name: Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/runner/go.mod
          cache-dependency-path: apps/runner/go.sum

      - name: Check runner formatting
        run: test -z "$(gofmt -l .)"

      - name: Test runner with the race detector
        run: go test -race ./...

      - name: Vet runner
        run: go vet ./...

      - name: Build runner
        run: go build -trimpath -o "${RUNNER_TEMP}/gosu-runner" ./cmd/gosu-runner

      - name: Validate optimizer syntax
        run: python3 -m py_compile optimizer/worker.py
