name: gosu-development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${GOSU_POSTGRES_DB:-gosu}
      POSTGRES_USER: ${GOSU_POSTGRES_USER:-gosu}
      POSTGRES_PASSWORD: ${GOSU_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - 127.0.0.1:${GOSU_POSTGRES_PORT:-5432}:5432
    volumes:
      - gosu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - 127.0.0.1:${GOSU_REDIS_PORT:-6379}:6379
    volumes:
      - gosu-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  gosu-postgres-data:
  gosu-redis-data:
